# Container configuration for blissbiz.biz; certificates are mounted at /tls.
server {
    listen 80 default_server;
    server_name _;
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Unknown host."}}';
}
server {
    listen 80;
    server_name blissbiz.biz *.blissbiz.biz;
    return 308 https://$host$request_uri;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    default_type application/json;
    return 404 '{"error":{"code":"not_found","message":"Unknown host."}}';
}
server {
    listen 443 ssl;
    server_name blissbiz.biz admin.blissbiz.biz ~^[a-z0-9]+(-[a-z0-9]+)*\.blissbiz\.biz$;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /opt/blissbiz/current/frontend/dist;
    index index.html;
    client_max_body_size 16m;
    client_body_timeout 30s;
    add_header X-Content-Type-Options nosniff always;
    error_page 413 = @too_large;
    error_page 502 503 504 = @unavailable;
    location @too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"image_too_large","message":"Upload request exceeds size limit."}}';
    }
    location @unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":{"code":"service_unavailable","message":"Service temporarily unavailable."}}';
    }
    location /api/ { include /etc/nginx/blissbiz-proxy.conf; }
    location /media/ { include /etc/nginx/blissbiz-proxy.conf; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
