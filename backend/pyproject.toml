[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blissbiz-backend"
version = "0.1.0"
description = "BlissBiz FastAPI backend"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pymysql[rsa]>=1.1,<2",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# long SQL strings and sample-data tables read better unwrapped; migrations are generated
"app/seed/*" = ["E501"]
"app/db/views.py" = ["E501"]
"migrations/versions/*" = ["E501"]
