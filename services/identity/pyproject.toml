[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blissbiz-identity"
version = "0.1.0"
description = "BlissBiz identity service: accounts, tenants, sessions"
requires-python = ">=3.11,<3.14"
dependencies = ["blissbiz-common", "blissbiz-backend", "uvicorn[standard]>=0.34,<1"]

[tool.setuptools.packages.find]
include = ["identity_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
